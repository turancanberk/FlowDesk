# ============================================================================
# FlowDesk — sürekli entegrasyon (Faz 20)
# ----------------------------------------------------------------------------
# Faz sonu komutlarının tamamı (CLAUDE.md) burada da koşar. İşler ayrı:
# hangisinin düştüğü tek bakışta görünsün ve birbirini beklemesinler.
#
# Sırlar depoda değil: CI, .env.example'ı kopyalayıp yerel değerlerle
# çalışır. Bunlar yalnızca koşu süresince yaşayan konteynerler için.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı dalda yeni bir itme gelirse süren koşuyu iptal et; ana dalda iptal
# etme, çünkü oradaki her commit'in sonucu ayrıca anlamlı.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend (derleme ve testler)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derle
        run: dotnet build backend/FlowDesk.slnx --configuration Debug

      # Entegrasyon testleri Testcontainers ile gerçek PostgreSQL, RabbitMQ,
      # Azurite, Redis ve Mailpit başlatır; runner'da Docker hazır.
      - name: Testler
        run: dotnet test backend/FlowDesk.slnx

  frontend:
    name: Frontend (biçim, lint, tip, derleme)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm --prefix frontend ci

      - name: Biçim
        run: npm --prefix frontend run format:check

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Tip kontrolü
        run: npm --prefix frontend run typecheck

      - name: Derleme
        run: npm --prefix frontend run build

  e2e:
    name: Tarayıcı testleri
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # Suite ortamı kökteki .env'den okuyor; CI'da örnek dosya yeterli,
      # çünkü tüm servisler bu koşuya ait ve koşu bitince yok oluyor.
      - name: Ortam dosyası
        run: cp .env.example .env

      - name: Altyapıyı başlat
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait

      - run: npm --prefix frontend ci
      - run: npm --prefix e2e ci

      - name: Playwright tarayıcısı
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Biçim ve tip kontrolü
        run: |
          npm --prefix e2e run format:check
          npm --prefix e2e run typecheck

      # Suite API'yi, Worker'ı ve frontend'in üretim derlemesini kendisi
      # başlatır; kendi veritabanını ve kuyruk önekini kullanır (ADR-0044).
      - name: Testler
        run: npm --prefix e2e test

      - name: Başarısızlık izleri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-izleri
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  security:
    name: Bağımlılık taraması
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # audit için bağımlılıkların kurulu olması gerekiyor.
      - run: npm --prefix frontend ci
      - run: npm --prefix e2e ci

      - name: Tarama
        run: ./scripts/security-scan.sh

  images:
    name: Üretim imajları
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Yalnızca derlenir; yayınlama, gerçek bir kayıt defteri (registry)
      # kararı verildiğinde eklenir.
      - name: API imajı
        run: >
          docker build -f backend/Dockerfile --target api
          --build-arg PROJECT=backend/src/FlowDesk.Api/FlowDesk.Api.csproj
          -t flowdesk-api:ci .

      - name: Worker imajı
        run: >
          docker build -f backend/Dockerfile --target worker
          --build-arg PROJECT=backend/src/FlowDesk.Worker/FlowDesk.Worker.csproj
          -t flowdesk-worker:ci .

      - name: Frontend imajı
        run: docker build -f frontend/Dockerfile -t flowdesk-web:ci .
