# ============================================================================
# FlowDesk — Yerel geliştirme altyapısı
# ----------------------------------------------------------------------------
# Kademeli altyapı ilkesi (ADR-0008): bir servis, onu gerçekten kullanan faz
# gelmeden buraya eklenmez.
#
# Şu an PostgreSQL (Faz 01), RabbitMQ (Faz 10), Mailpit (Faz 12),
# Azurite (Faz 13), Redis (Faz 15), Prometheus ve Grafana (Faz 18) vardır.
#
# Prometheus ve Grafana "observability" profilinin arkasındadır: günlük
# geliştirmede gerekmez, gerektiğinde açılır (ADR-0008).
#
#   docker compose -f infra/docker-compose.yml --profile observability up -d
#
# Kullanım (depo kökünden):
#   cp .env.example .env
#   docker compose -f infra/docker-compose.yml up -d
# ============================================================================

name: flowdesk

services:
  postgres:
    image: postgres:17-alpine
    container_name: flowdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowdesk}
      POSTGRES_USER: ${POSTGRES_USER:-flowdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimlanmalidir}
      # Türkçe harmanlama, tr-TR sıralama davranışının veritabanı tarafında da
      # tutarlı olmasını sağlar.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=tr_TR.UTF-8"
      LANG: tr_TR.utf8
    ports:
      # Bu makinede 5432 baska bir PostgreSQL tarafindan kullaniliyor.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready kullanicisi acikca verilir; aksi halde konteyner kullanicisi
      # varsayilan alinir ve saglik kontrolu yaniltici sekilde basarisiz olur.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowdesk} -d ${POSTGRES_DB:-flowdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    # Yönetim eklentili imaj: kuyrukların ve mesajların gerçekten oluştuğunu
    # tarayıcıdan görebilmek, geliştirme sırasında log okumaktan çok daha hızlı
    # geri bildirim veriyor.
    image: rabbitmq:4-management-alpine
    container_name: flowdesk-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-flowdesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD .env dosyasinda tanimlanmalidir}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # check_port_connectivity yerine check_running: port açık olması broker'ın
      # mesaj kabul etmeye hazır olduğu anlamına gelmiyor, ve bağımlı servisler
      # tam olarak bunu bekliyor.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      # RabbitMQ ilk açılışta Erlang dağıtımını kurar; bu süre bilerek uzun.
      start_period: 40s

  mailpit:
    # Yerel geliştirme için SMTP sunucusu ve posta kutusu. Gerçek bir sağlayıcıya
    # bağlanmadan, gönderilen postanın biçimini ve içeriğini tarayıcıdan görmeyi
    # sağlıyor; test ortamında kimseye posta gitmemesi de bunun bir sonucu.
    image: axllent/mailpit:v1.31.2
    container_name: flowdesk-mailpit
    restart: unless-stopped
    environment:
      # Yerelde kimlik doğrulaması yok; Mailpit yalnızca bu makineden erişilen
      # bir geliştirme aracı ve üretime hiç gitmiyor.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      # Mailpit imajında curl yok; kendi readiness komutunu sunuyor.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  azurite:
    # Azure Blob Storage'ın yerel öykünücüsü. Üretimde gerçek bir depolama
    # hesabı kullanılacak; bağlantı dizesi dışında hiçbir şey değişmiyor.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: flowdesk-azurite
    restart: unless-stopped
    # Yalnızca blob servisi. Queue ve table bu üründe kullanılmıyor ve
    # açık bırakmak, kullanılmayan iki dinleyici demek olurdu.
    command: >-
      azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      # Azurite imajında curl yok; Node zaten var ve kendi portunu yoklayabiliyor.
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: flowdesk-redis
    restart: unless-stopped
    # Kalıcılık kapalı. Buradaki her şey türetilmiş veri; kaybolduğunda yeniden
    # hesaplanıyor. Diske yazmak, hiçbir zaman geri okunmayacak veriyi
    # kaydetmek olurdu.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # Bu makinede 6379 baska bir Redis tarafindan kullaniliyor.
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================================================
  # Gözlemlenebilirlik (Faz 18) — yalnızca profil açıkken
  # ==========================================================================

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: flowdesk-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # Metrikleri uygulamalar gönderiyor; bu bayrak olmadan OTLP uç noktası
      # kapalıdır (ADR-0042).
      - "--web.enable-otlp-receiver"
      - "--storage.tsdb.path=/prometheus"
      # Yerel geliştirme için iki hafta fazlasıyla yeterli.
      - "--storage.tsdb.retention.time=14d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:13.2.2
    container_name: flowdesk-grafana
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD .env dosyasinda tanimlanmalidir}
      # Yerel kurulumda dışarı açılan bir şey yok; kayıt ve telemetri kapalı.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Veri kaynağı ve pano depoda; Grafana'da elle kurulan hiçbir şey yok.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
    name: flowdesk-postgres-data
  rabbitmq-data:
    name: flowdesk-rabbitmq-data
  mailpit-data:
    name: flowdesk-mailpit-data
  azurite-data:
    name: flowdesk-azurite-data
  prometheus-data:
    name: flowdesk-prometheus-data
  grafana-data:
    name: flowdesk-grafana-data
